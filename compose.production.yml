services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: publishguard
      POSTGRES_USER: publishguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U publishguard -d publishguard']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      target: migrate
    profiles: ['migrate']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://publishguard:${POSTGRES_PASSWORD}@postgres:5432/publishguard

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      target: web
      args:
        APP_URL: ${NEXT_PUBLIC_APP_URL:-https://getpublishguard.com}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://publishguard:${POSTGRES_PASSWORD}@postgres:5432/publishguard
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://getpublishguard.com}
      AUTH_URL: ${NEXT_PUBLIC_APP_URL:-https://getpublishguard.com}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      KDP_OUTLINE_MODEL: ${KDP_OUTLINE_MODEL:-gemini-flash-latest}
      KDP_WRITER_MODEL: ${KDP_WRITER_MODEL:-gemini-flash-latest}
      KDP_SANITIZER_MODEL: ${KDP_SANITIZER_MODEL:-gemini-flash-latest}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
      FALLBACK_BASE_URL: ${FALLBACK_BASE_URL:-https://api.deepseek.com/v1}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-deepseek-chat}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SIGNING_SECRET: ${STRIPE_SIGNING_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      KDP_ARTIFACTS_DIR: /app/data/kdp-artifacts
    volumes:
      - kdp_artifacts:/app/data/kdp-artifacts
    ports:
      - '127.0.0.1:3000:3000'

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://publishguard:${POSTGRES_PASSWORD}@postgres:5432/publishguard
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://getpublishguard.com}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai}
      KDP_OUTLINE_MODEL: ${KDP_OUTLINE_MODEL:-gemini-flash-latest}
      KDP_WRITER_MODEL: ${KDP_WRITER_MODEL:-gemini-flash-latest}
      KDP_SANITIZER_MODEL: ${KDP_SANITIZER_MODEL:-gemini-flash-latest}
      FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
      FALLBACK_BASE_URL: ${FALLBACK_BASE_URL:-https://api.deepseek.com/v1}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-deepseek-chat}
      KDP_ARTIFACTS_DIR: /app/data/kdp-artifacts
    volumes:
      - kdp_artifacts:/app/data/kdp-artifacts

volumes:
  pg_data:
  kdp_artifacts:
